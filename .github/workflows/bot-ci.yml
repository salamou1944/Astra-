name: ASTRA BOT CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/live_readiness_check.py
      - run: python scripts/astra_bot.py
      - name: Assert paper-only
        run: python -c "import json; d=json.load(open('evidence/astra_bot_snapshot.json')); assert d['mode']=='PAPER' and d['live_order_submitted'] is False; print('ASTRA BOT PAPER SMOKE PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: astra-bot-evidence
          path: evidence/astra_bot_snapshot.json
